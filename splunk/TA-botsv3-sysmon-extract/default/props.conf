# The Splunk Add-on for Sysmon renames the BOTS v3 Sysmon sourcetype to XmlWinEventLog
# but does not extract fields for that generic sourcetype (that normally comes from the
# Windows add-on). These search-time extractions pull Sysmon fields straight from the XML.
# Both stanzas are listed so extraction applies whether Splunk keys off the renamed
# sourcetype or the original lowercase one.
[XmlWinEventLog]
REPORT-sysmon_eventdata = sysmon_eventdata_kv
REPORT-sysmon_eventcode = sysmon_eventcode
REPORT-sysmon_computer  = sysmon_computer

[xmlwineventlog:microsoft-windows-sysmon/operational]
REPORT-sysmon_eventdata = sysmon_eventdata_kv
REPORT-sysmon_eventcode = sysmon_eventcode
REPORT-sysmon_computer  = sysmon_computer
