# Dynamic key/value extraction of every <Data Name='X'>value</Data> pair in the
# Sysmon EventData block. Produces native Sysmon field names: Image, CommandLine,
# ParentImage, ParentCommandLine, DestinationIp, DestinationPort, User, etc.
[sysmon_eventdata_kv]
REGEX = <Data Name=['"]([^'"]+)['"]>([^<]*)</Data>
FORMAT = $1::$2
MV_ADD = true

# EventCode from the System/EventID element (handles optional Qualifiers attribute).
[sysmon_eventcode]
REGEX = <EventID(?:\s+[^>]*)?>(\d+)</EventID>
FORMAT = EventCode::$1

# Full computer name from the System block.
[sysmon_computer]
REGEX = <Computer>([^<]+)</Computer>
FORMAT = Computer::$1
