title: Process Execution From Windows Temp Directory
id: aeb2a288-eefa-47ec-a9ea-d908062719f9
status: experimental
description: |
    Detects a process whose image runs from a Windows Temp path. Attackers drop and run
    tooling from Temp because it is world-writable and often ignored. Review the image, the
    parent, and the command line.
references:
    - https://github.com/reynaldusjasona/soc-detection-lab/blob/main/investigations/02-fyodor-struts-compromise.md
author: Jason Reynaldus (reynaldusjasona)
date: 2026-11-16
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|contains:
            - '\Windows\Temp\'
            - '\AppData\Local\Temp\'
    filter_known_good:
        Image|endswith:
            - '\DismHost.exe'
            - 'Update.exe'
    condition: selection and not filter_known_good
falsepositives:
    - Installers and updaters that stage executables in Temp. The filter removes DismHost and
      common updaters; add others seen in your own baseline.
level: medium
tags:
    - attack.execution
    - attack.t1059
# Validated against BOTS v3: catches iexeplorer.exe (34, Struts2 client) and hdoor.exe (1,
# scanner) from C:\Windows\Temp\ on FYODOR-L (2018-08-20). Tuning: before the filter the rule
# also hit DismHost.exe (Windows servicing) and DropboxUpdate.exe under AppData\Local\Temp;
# the filter removes those known-good updaters.
